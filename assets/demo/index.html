<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drift</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { background: transparent; }
    .top { padding-top: 46px; height: 98px; }
    .tabs { bottom: 26px; }
    main { height: calc(100% - 98px); }
    .sheet { width: 100%; margin-left: 0; left: 0; }
    .scrim { background: rgba(43,27,23,.4); }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <header class="top">
    <span class="word">Drift</span>
    <div class="lang" id="lang">
      <button data-lang="en">EN</button><button data-lang="ru">RU</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <i class="indicator" id="indicator"></i>
    <button data-tab="share" id="tab-share"></button>
    <button data-tab="history" id="tab-history"></button>
  </nav>

  <div class="scrim" id="scrim"></div>

  <section class="sheet" id="sheet-host">
    <i class="handle"></i>
    <h2 data-i18n="hostTitle"></h2>
    <p class="hint" data-i18n="hostHint"></p>
    <div class="hostbody" id="host-body">
      <div class="qrcard"><img id="qr" alt="QR" /></div>
      <div class="code" id="code"></div>
      <div class="waiting"><i class="pulse"></i><span data-i18n="hostWaiting"></span></div>
    </div>
    <p class="error" id="host-error"></p>
    <button class="btn glass" data-close data-i18n="cancel"></button>
  </section>

  <section class="sheet" id="sheet-join">
    <i class="handle"></i>
    <h2 data-i18n="joinTitle"></h2>
    <p class="hint" data-i18n="joinHint"></p>
    <input id="join-code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" />
    <p class="status" id="join-status">&nbsp;</p>
    <button class="btn primary" id="join-go" data-i18n="joinConnect"></button>
    <button class="btn glass" data-close data-i18n="cancel"></button>
  </section>

  <section class="sheet" id="sheet-text">
    <i class="handle"></i>
    <h2 data-i18n="sendText"></h2>
    <textarea id="text-input" data-i18n-placeholder="composerPlaceholder"></textarea>
    <button class="btn primary" id="text-go"></button>
  </section>

  <div class="drop" id="drop"><div><span data-i18n="dropHere"></span></div></div>

  <script src="vendor/gsap.min.js"></script>
  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
